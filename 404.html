<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>404 — Página no encontrada | Thor Essence</title>
  
  <meta name="theme-color" content="#EEF2F6">
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Estilos Personalizados Emil Kowalski & Glassmorphism -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-[#EEF2F6] text-slate-900 min-h-screen flex items-center justify-center p-4 relative overflow-hidden selection:bg-amber-400 selection:text-slate-950">

  <!-- Luces Ambientales Suaves de Fondo -->
  <div class="ambient-glow-gold -top-24 -left-24"></div>
  <div class="ambient-glow-navy -bottom-28 -right-28"></div>
  <div class="ambient-glow-gold bottom-12 left-1/4 opacity-40"></div>

  <!-- Tarjeta Central de Error 404 Glassmorphism White Luxury -->
  <div class="glass-card-luxury relative w-full max-w-lg p-7 sm:p-10 text-center space-y-6 shadow-xl border border-slate-200/90 z-10">
    
    <!-- Logo Oficial Thor Essence con Marco Dorado -->
    <div class="brand-logo-frame w-20 h-20 sm:w-24 sm:h-24 mx-auto shadow-md">
      <img src="assets/logo.jpg" alt="Thor Essence Logo" class="w-full h-full object-cover">
    </div>

    <!-- Código de Error y Título -->
    <div class="space-y-2">
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-50 border border-amber-200 text-amber-800 text-xs font-bold tracking-widest uppercase">
        Error 404
      </span>
      <h1 class="font-brand text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-wide">
        Página No Encontrada
      </h1>
      <p class="text-sm sm:text-base text-slate-600 max-w-md mx-auto leading-relaxed">
        La ruta que intentas consultar no existe o ha sido movida. Todo el catálogo de productos, registro de ventas y tanques importados están disponibles en el panel principal.
      </p>
    </div>

    <!-- Botón de Retorno con Física de Resorte Emil Kowalski -->
    <div class="pt-2">
      <a href="index.html" class="btn-tactile btn-gold py-3 px-6 text-sm font-bold shadow-md inline-flex items-center gap-2">
        <span>←</span>
        <span>Regresar al Sistema Principal</span>
      </a>
    </div>

    <!-- Pie de Marca -->
    <div class="pt-4 border-t border-slate-200 text-xs text-slate-500">
      <span class="font-brand text-amber-700 font-semibold">Thor Essence</span> — Belleza, aroma y estilo
    </div>
  </div>

</body>
</html>
