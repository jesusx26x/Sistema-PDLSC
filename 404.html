<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>404 — Página no encontrada | Thor Essence</title>
  
  <meta name="theme-color" content="#040714">
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Estilos Personalizados Emil Kowalski & Glassmorphism -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-[#040714] text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden selection:bg-amber-400 selection:text-slate-950">

  <!-- Luces Ambientales de Fondo (Glassmorphism Glow) -->
  <div class="ambient-glow-gold -top-24 -left-24"></div>
  <div class="ambient-glow-navy -bottom-28 -right-28"></div>
  <div class="ambient-glow-gold bottom-12 left-1/4 opacity-40"></div>

  <!-- Tarjeta Central de Error 404 Glassmorphism -->
  <div class="glass-card-luxury relative w-full max-w-lg p-7 sm:p-10 text-center space-y-6 shadow-2xl z-10">
    
    <!-- Logo Oficial Thor Essence con Halo Dorado -->
    <div class="brand-logo-frame w-20 h-20 sm:w-24 sm:h-24 mx-auto shadow-2xl">
      <img src="assets/logo.jpg" alt="Thor Essence Logo" class="w-full h-full object-cover">
    </div>

    <!-- Código de Error y Título -->
    <div class="space-y-2">
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-500/15 border border-amber-500/30 text-amber-300 text-xs font-bold tracking-widest uppercase">
        Error 404
      </span>
      <h1 class="font-brand text-3xl sm:text-4xl font-extrabold text-amber-300 tracking-wide">
        Página No Encontrada
      </h1>
      <p class="text-sm sm:text-base text-slate-300 max-w-md mx-auto leading-relaxed">
        La ruta que intentas consultar no existe o ha sido movida. Todo el catálogo de productos, registro de ventas y tanques importados están en el panel de inicio.
      </p>
    </div>

    <!-- Botón de Retorno con Física de Resorte Emil Kowalski -->
    <div class="pt-2">
      <a href="index.html" class="btn-tactile btn-gold py-3 px-6 text-sm font-bold shadow-xl inline-flex items-center gap-2">
        <span>←</span>
        <span>Regresar al Sistema Principal</span>
      </a>
    </div>

    <!-- Pie de Marca -->
    <div class="pt-4 border-t border-slate-800/80 text-xs text-slate-400">
      <span class="font-brand text-amber-300/90 font-semibold">Thor Essence</span> — Belleza, aroma y estilo
    </div>
  </div>

</body>
</html>
